[project]
name = "anndata-rs-benchmarks"
version = "0.0.0"
description = "Reference benchmarks comparing anndata-rs against the native Python anndata/scipy stack."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anndata>=0.11",
    "numpy>=2,<3",
    "scipy>=1.11",
    "pandas>=2.2,<3",
    "h5py>=3.11",
]

[project.optional-dependencies]
# Building the Rust extension is slow; keep it opt-in via `uv sync --extra rust`.
rust = ["anndata_rs"]

[project.scripts]
bench-select = "anndata_rs_benchmarks.select_bench:main"
bench-io = "anndata_rs_benchmarks.io_bench:main"
bench-anndata = "anndata_rs_benchmarks.anndata_bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anndata_rs_benchmarks"]

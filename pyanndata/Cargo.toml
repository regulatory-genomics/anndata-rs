[package]
name = "pyanndata"
version = "0.7.1"
edition = "2024"
rust-version = "1.88"
authors = ["Kai Zhang <kai@kzhang.org>"]
description = "Rust APIs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kaizhang/anndata-rs"
homepage = "https://github.com/kaizhang/anndata-rs"
keywords = ["data"]

[dependencies]
anndata = { version = "0.7.0", path = "../anndata" }
anndata-hdf5 = { version = "0.6.0", path = "../anndata-hdf5" }
anyhow = "1.0"
downcast-rs = "2"
numpy = "0.27"
ndarray = "0.17"
sprs = "0.11.4"
hdf5 = { package = "hdf5-metno", version = "0.12" }
polars = { version = "0.53", features = ["ndarray"] }
pyo3-polars = {version = "0.26", features = ["dtype-full", "dtype-struct"] }
rand = "0.9"
flate2 = "1.0"
rayon = "1.11"

[dependencies.pyo3]
version = "0.27"
features = ["multiple-pymethods", "anyhow"]

[features]
extension-module = ["pyo3/extension-module"]

[lib]
crate-type = ["lib"]

[lints]
workspace = true
